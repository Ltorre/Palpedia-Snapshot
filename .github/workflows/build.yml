name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: go test ./...
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o dist/palworld-save-scrap.exe ./cmd/palworld-save-scrap
      - uses: actions/upload-artifact@v4
        with:
          name: palworld-save-scrap-windows-amd64
          path: dist/palworld-save-scrap.exe
