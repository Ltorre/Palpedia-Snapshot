name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: go test ./...
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o dist/palworld-save-scrap.exe ./cmd/palworld-save-scrap
      - uses: actions/upload-artifact@v4
        with:
          name: palworld-save-scrap-windows-amd64
          path: dist/palworld-save-scrap.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME}" -o dist/palworld-save-scrap-windows-amd64.exe ./cmd/palworld-save-scrap
      - run: test -f "releases/${GITHUB_REF_NAME}.md"
      - run: gh release create "$GITHUB_REF_NAME" dist/palworld-save-scrap-windows-amd64.exe --title "$GITHUB_REF_NAME" --notes-file "releases/${GITHUB_REF_NAME}.md"
        env:
          GH_TOKEN: ${{ github.token }}

  sync-release-notes:
    if: github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          for note in releases/v*.md; do
            tag="$(basename "$note" .md)"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$note"
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
